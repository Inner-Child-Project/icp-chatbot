services:
  chatbot:
    build: .
    ports:
      - "8100:8100"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-icp-chatbot}
      - N8N_LEAD_WEBHOOK_URL=${N8N_LEAD_WEBHOOK_URL:-http://n8n:5678/webhook/icp-lead}
      - N8N_LEAD_WEBHOOK_SECRET=${N8N_LEAD_WEBHOOK_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://products.innerchildproject.us,http://localhost:4321}
      - RATE_LIMIT=${RATE_LIMIT:-20}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - THREAD_RATE_LIMIT=${THREAD_RATE_LIMIT:-20}
      - THREAD_RATE_LIMIT_WINDOW=${THREAD_RATE_LIMIT_WINDOW:-60}
      - MAX_TURNS=${MAX_TURNS:-24}
      - THREAD_TOKEN_BUDGET=${THREAD_TOKEN_BUDGET:-8000}
      - CHAT_API_TOKEN=${CHAT_API_TOKEN:-}
    volumes:
      - chatbot-data:/app/data
    networks:
      - icp-net
    restart: unless-stopped

volumes:
  chatbot-data:

networks:
  icp-net:
    external: true
